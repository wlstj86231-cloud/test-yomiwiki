<body><main><article><h1>요미위키 소개</h1><p>요미위키는 농산물·농축산물·농기계 거래 전에 확인할 기준과 절차를 정리하는 지식사전입니다.</p><h2>운영 관계</h2><p>요미위키와 보리장터는 같은 운영자의 사이트입니다. 보리장터로 연결되는 관련 안내는 유입 경로를 측정할 수 있습니다.</p><h2>편집 원칙</h2><p>공식 자료를 우선하고, 확인되지 않은 가격·등급·안전 정보를 단정하지 않습니다. 오류가 있으면 <a href="/contact">정정 요청</a>을 받습니다.</p><p><a href="/mn/" lang="mn">Монгол хэл дээрх гарын авлага</a></p><p><a href="/">요미위키 홈</a></p></article></main></body>
